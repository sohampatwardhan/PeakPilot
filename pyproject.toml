[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peakpilot"
version = "0.1.0"
description = "Massachusetts-aware building energy demand-coordination simulator (Hackachusetts 2026)."
readme = "README.md"
requires-python = ">=3.11"
# The simulation engine (peakpilot/engine.py) is pure standard library and needs
# no install-time dependencies. The dashboard deps live in requirements.txt.
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit==1.40.2", "pandas==2.2.3", "plotly==5.24.1"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools]
packages = ["peakpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags are passed by CI (`pytest --cov`) rather than set here, so a bare
# `pip install pytest && pytest -q` still works for the engine-only suite.
addopts = ["--strict-markers"]
markers = [
    "dashboard: needs the Streamlit dashboard deps (requirements.txt); skipped if missing",
]

[tool.coverage.run]
source = ["peakpilot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
